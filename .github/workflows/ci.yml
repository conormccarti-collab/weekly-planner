name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    name: End-to-end tests (Playwright)
    # v5 Stage 12b: blocked on a sign-in method — this job is a no-op until
    # vars.E2E_READY is flipped to 'true', so a push isn't permanently red
    # over something still pending that decision. The sign-in itself is
    # unblocked: scripts/e2e-login.mjs mints a real session non-interactively
    # (same mechanism a real magic-link sign-in uses — see its own header
    # comment) using the service-role key already below, so the only thing
    # left for a human to do is add the ALLOWED_EMAIL secret and flip
    # E2E_READY — see __tests__/e2e/README.md.
    if: ${{ vars.E2E_READY == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Mint a real signed-in session for Playwright
        run: node scripts/e2e-login.mjs
      - run: npm run test:e2e
